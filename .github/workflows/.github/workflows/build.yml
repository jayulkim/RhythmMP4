name: RhythmMP4 Android Plugin Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build RhythmMP4
        run: |
          chmod +x ./gradlew
          ./gradlew assemble --stacktrace

      - name: Upload AAR files
        uses: actions/upload-artifact@v4
        with:
          name: RhythmMP4-Android-AAR
          path: |
            plugin/build/outputs/aar/RhythmMP4-debug.aar
            plugin/build/outputs/aar/RhythmMP4-release.aar
          if-no-files-found: error
